<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bybit P2P Scanner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="glow"></div>

    <div class="container">
        <h1>Welcome to P2P Scanner</h1>
        <p class="subtitle">Умный поиск (3-и лица, ЛК на руках)</p>

        <button id="refreshBtn" class="btn-primary" onclick="fetchData()">
            <span id="btnText">Обновить данные</span>
            <div class="spinner" id="spinner"></div>
        </button>
        
        <div class="timer-text" id="timerText">Автообновление через: <span id="countdown">25</span> сек.</div>

        <div id="results"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
