<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>W.I.C - База Знаний</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
    </div>

    <div id="screen-home" class="screen active">
        <header class="top-bar">
            <div class="user-info" id="userGreeting">
                <span class="greet">Привет 👋</span>
                <span class="name" id="userName">Загрузка...</span>
            </div>
            <div class="avatar" id="userAvatar">U</div>
        </header>

        <div class="banner">
            <h1>База Знаний P2P</h1>
            <p>Всё самое важное в одном месте. Выбирай раздел и прокачивайся.</p>
        </div>

        <h3 class="section-title">Разделы</h3>
        <div class="categories-grid" id="categoriesGrid"></div>
    </div>

    <div id="screen-category" class="screen">
        <header class="top-bar">
            <button class="back-btn" onclick="show('home')">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <h2 id="categoryTitle" style="font-size: 18px; font-weight: 800;">Категория</h2>
            <div style="width: 24px;"></div>
        </header>
        
        <div id="articlesList" class="articles-list"></div>
        <button id="adminAddBtn" class="floating-btn" onclick="openEditModal()" style="display: none;">+</button>
    </div>

    <div id="screen-article" class="screen">
        <header class="top-bar">
            <button class="back-btn" onclick="backToCategory()">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <h2 style="font-size: 16px; font-weight: 800; color: var(--dim);">Чтение</h2>
            <button class="edit-btn" id="adminEditBtn" onclick="openEditModal(true)" style="display: none;">✏️</button>
        </header>

        <div class="article-content">
            <h1 id="articleTitle"></h1>
            <div class="article-date" id="articleDate"></div>
            <div class="article-text" id="articleText"></div>
        </div>
    </div>

    <div id="editModal" class="modal-overlay">
        <div class="modal">
            <h3 id="modalTitle">Добавить статью</h3>
            <input type="text" id="editTitle" class="input" placeholder="Заголовок" style="margin-bottom: 12px;">
            <textarea id="editContent" class="input" rows="8" placeholder="Текст статьи..." style="margin-bottom: 12px;"></textarea>
            <button class="btn btn-primary" onclick="saveArticle()">Сохранить</button>
            <button class="btn btn-ghost" onclick="closeModal('editModal')" style="margin-top: 8px;">Отмена</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
