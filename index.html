<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Arbitrage | Premium UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #030611; 
            color: white; 
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .aurora-bg {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 50%, rgba(0, 82, 255, 0.25) 0%, rgba(0, 20, 50, 0.4) 40%, rgba(3, 6, 17, 1) 80%);
            z-index: -1; pointer-events: none;
        }

        .tactile-card {
            background: linear-gradient(145deg, #0a1128, #050814);
            border-radius: 48px;
            box-shadow: 20px 20px 60px rgba(0, 0, 0, 0.8), -1px -1px 2px rgba(255, 255, 255, 0.05), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 420px;
        }

        .soft-blue-block {
            background: linear-gradient(135deg, #1e55ff 0%, #0a36cc 100%);
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(30, 85, 255, 0.4), inset 0 2px 5px rgba(255, 255, 255, 0.3), inset 0 -2px 5px rgba(0, 0, 0, 0.2);
        }

        .glass-inner {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.05);
        }

        .btn-neumorph {
            background: linear-gradient(145deg, #111a33, #070b18);
            box-shadow: 6px 6px 12px rgba(0, 0, 0, 0.6), -2px -2px 8px rgba(255, 255, 255, 0.05), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.02);
            transition: all 0.2s ease;
        }
        .btn-neumorph:active { box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.6), inset -2px -2px 8px rgba(255, 255, 255, 0.05); }

        .btn-send {
            background: linear-gradient(135deg, #3b82f6, #0052ff);
            box-shadow: 0 8px 20px rgba(0, 82, 255, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.4), inset 0 -2px 4px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
        }
        .btn-send:active { transform: translateY(2px); box-shadow: 0 4px 10px rgba(0, 82, 255, 0.5); }

        .text-profit { text-shadow: 0 0 20px rgba(255, 255, 255, 0.4); }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="p-4">
    <div class="aurora-bg"></div>

    <div class="tactile-card p-5 animate-fade-in" id="main-card">
        <div class="soft-blue-block p-6 relative z-10">
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center gap-2">
                    <div class="w-6 h-6 rounded-full bg-white/20 flex items-center justify-center text-[10px] font-bold">AS</div>
                    <span class="text-sm font-medium text-blue-100" id="pair-title">Поиск связок...</span>
                </div>
                <div class="px-2 py-1 rounded bg-black/20 text-xs font-bold" id="type-badge">LIVE</div>
            </div>

            <div class="text-center mb-8">
                <div class="inline-block bg-white/10 rounded-full px-4 py-1 text-xs font-semibold tracking-wider text-blue-100 mb-2 border border-white/10">
                    ЧИСТАЯ ПРИБЫЛЬ
                </div>
                <h1 class="text-5xl font-extrabold text-white text-profit tracking-tight" id="profit-value">
                    +0.00%
                </h1>
            </div>

            <div class="flex justify-center gap-3" id="coin-icons">
                <div class="w-12 h-12 rounded-full bg-[#F3BA2F] flex items-center justify-center text-black font-bold shadow-lg border-2 border-blue-400">B</div>
                <div class="w-12 h-12 rounded-full bg-black flex items-center justify-center text-white font-bold shadow-lg border-2 border-blue-400 text-[10px]">Bybit</div>
                <div class="w-12 h-12 rounded-full bg-white flex items-center justify-center text-black font-bold shadow-lg border-2 border-blue-400 text-[10px]">OKX</div>
                <div class="w-12 h-12 rounded-full bg-blue-900 flex items-center justify-center text-white font-bold shadow-lg border-2 border-blue-400 text-[10px]">MEXC</div>
            </div>
        </div>

        <div class="mt-4 px-1">
            <div class="glass-inner p-5">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-xs text-gray-400 font-medium" id="details-label">Детали связки</span>
                    <span class="text-xs text-blue-400 underline decoration-blue-400/30">Маркет</span>
                </div>
                
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center border border-white/10">
                            <span class="text-xs font-bold text-green-400">Buy</span>
                        </div>
                        <div>
                            <p class="text-sm font-semibold text-white" id="buy-exchange">...</p>
                            <p class="text-xs text-gray-400" id="buy-price">...</p>
                        </div>
                    </div>
                    <div class="text-gray-500 text-xl font-light">➔</div>
                    <div class="flex items-center gap-3 text-right">
                        <div>
                            <p class="text-sm font-semibold text-white" id="sell-exchange">...</p>
                            <p class="text-xs text-gray-400" id="sell-price">...</p>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center border border-white/10">
                            <span class="text-xs font-bold text-red-400">Sell</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-6 flex gap-3 justify-between items-center px-1">
            <button class="btn-neumorph w-14 h-14 rounded-full flex items-center justify-center text-gray-300">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>

            <button class="btn-neumorph w-14 h-14 rounded-full flex items-center justify-center text-gray-300">
                 <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
            </button>

            <button class="btn-send flex-1 h-14 rounded-full flex items-center justify-center gap-2 text-white font-semibold text-sm" id="trade-btn">
                Торговать
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </div>
    </div>

    <script>
        const socket = io();
        
        const elPair = document.getElementById('pair-title');
        const elProfit = document.getElementById('profit-value');
        const elBuyEx = document.getElementById('buy-exchange');
        const elSellEx = document.getElementById('sell-exchange');
        const elBuyPrice = document.getElementById('buy-price');
        const elSellPrice = document.getElementById('sell-price');
        const elTradeBtn = document.getElementById('trade-btn');
        const elTypeBadge = document.getElementById('type-badge');
        const elDetailsLabel = document.getElementById('details-label');

        socket.on('arbitrageData', (data) => {
            if (!data || data.length === 0) return;

            const best = data[0];

            elPair.textContent = best.pair;
            elProfit.textContent = `${best.profit > 0 ? '+' : ''}${best.profit.toFixed(3)}%`;
            elBuyEx.textContent = best.buyEx.toUpperCase();
            elSellEx.textContent = best.sellEx.toUpperCase();
            
            elTypeBadge.textContent = best.type;
            elTypeBadge.className = best.type === 'P2P' 
                ? 'px-2 py-1 rounded bg-purple-500/20 text-xs font-bold text-purple-300'
                : 'px-2 py-1 rounded bg-green-500/20 text-xs font-bold text-green-300';

            elDetailsLabel.textContent = best.type === 'P2P' ? 'Детали (Фиат)' : 'Детали (Спот)';

            // Форматирование цен
            if (best.type === 'P2P') {
                elBuyPrice.textContent = `${best.buyPrice.toFixed(2)} FIAT`;
                elSellPrice.textContent = `${best.sellPrice.toFixed(2)} FIAT`;
            } else {
                elBuyPrice.textContent = `$${best.buyPrice.toFixed(2)}`;
                elSellPrice.textContent = `$${best.sellPrice.toFixed(2)}`;
            }

            // Логика кнопки
            let url = '#';
            if (best.type === 'P2P') {
                url = 'https://p2p.binance.com/en/trade/buy/USDT';
            } else {
                let coin = best.pair.split('/')[0];
                if (best.buyEx.toLowerCase().includes('binance')) {
                    url = `https://www.binance.com/en/trade/${coin}_USDT?type=spot`;
                } else if (best.buyEx.toLowerCase().includes('bybit')) {
                    url = `https://www.bybit.com/en/trade/spot/${coin}/USDT`;
                } else if (best.buyEx.toLowerCase().includes('okx')) {
                    url = `https://www.okx.com/trade-spot/${coin.toLowerCase()}-usdt`;
                } else {
                    url = `https://www.mexc.com/exchange/${coin}_USDT`;
                }
            }
            
            elTradeBtn.onclick = () => window.open(url, '_blank');
        });
    </script>
</body>
</html>
